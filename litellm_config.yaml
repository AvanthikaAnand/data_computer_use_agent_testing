# LiteLLM Proxy Configuration
# Dashboard: http://localhost:4000/ui
# Docs:      http://localhost:4000/docs

model_list:
  # ── Computer-use capable model (HK/SG Bedrock account, ap-southeast-1) ────
  # Uses global inference profile — confirmed working with computer_20250124.
  # Credentials are hardcoded here (separate from the default AWS env vars).
  - model_name: claude-computer-use
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_access_key_id: os.environ/BEDROCK_HK_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/BEDROCK_HK_SECRET_ACCESS_KEY
      aws_region_name: ap-southeast-1

  # ── Anthropic on Bedrock (HK/SG account, ap-southeast-1) ─────────────────
  # Using global. inference prefix — works from ap-southeast-1
  - model_name: claude-sonnet-4-5
    litellm_params:
      model: bedrock/global.anthropic.claude-sonnet-4-5-20250929-v1:0
      aws_access_key_id: os.environ/BEDROCK_HK_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/BEDROCK_HK_SECRET_ACCESS_KEY
      aws_region_name: ap-southeast-1

  # claude-sonnet-3-7 not available in this Bedrock account — omitted

  - model_name: claude-sonnet-3-5
    litellm_params:
      # Requires cross-region inference profile prefix in ap-southeast-1
      model: bedrock/apac.anthropic.claude-3-5-sonnet-20241022-v2:0
      aws_access_key_id: os.environ/BEDROCK_HK_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/BEDROCK_HK_SECRET_ACCESS_KEY
      aws_region_name: ap-southeast-1

  # claude-haiku-3-5 removed — LEGACY in us-east-1, access revoked by AWS

  - model_name: claude-haiku-3
    litellm_params:
      # Claude 3 Haiku — ACTIVE in ap-southeast-1, good for lightweight tasks
      model: bedrock/anthropic.claude-3-haiku-20240307-v1:0
      aws_access_key_id: os.environ/BEDROCK_HK_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/BEDROCK_HK_SECRET_ACCESS_KEY
      aws_region_name: ap-southeast-1

  # ── Meta Llama on Bedrock (us-east-1 — no global prefix for Llama) ────────
  - model_name: llama-3-2-90b
    litellm_params:
      model: bedrock/us.meta.llama3-2-90b-instruct-v1:0
      aws_region_name: us-east-1

  - model_name: llama-3-3-70b
    litellm_params:
      model: bedrock/us.meta.llama3-3-70b-instruct-v1:0
      aws_region_name: us-east-1

  # ── Anthropic direct (fallback / non-AWS) ─────────────────────────────────
  - model_name: claude-direct-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── Ollama local models ───────────────────────────────────────────────────
  - model_name: llava
    litellm_params:
      model: ollama/llava
      api_base: os.environ/OLLAMA_BASE_URL

  - model_name: qwen2-5-vl
    litellm_params:
      model: ollama/qwen2.5vl
      api_base: os.environ/OLLAMA_BASE_URL

litellm_settings:
  drop_params: true               # ignore unsupported params per model
  request_timeout: 600
  num_retries: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY   # set in .env; gates the /ui dashboard
  store_model_in_db: true
  # DATABASE_URL is injected via environment variable in docker-compose
