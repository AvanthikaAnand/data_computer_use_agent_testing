// mozilla.cfg — applied by Firefox on every launch, from the installation
// directory (not the profile), so these prefs survive Docker volume mounts.
// Uses pref() so they can still be overridden via about:config if needed.
// Activated by defaults/pref/autoconfig.js.

// ── Rendering — software WebRender, no GPU needed ────────────────────────────
pref("gfx.webrender.software", true);

// ── Script timeout — unlimited (Google auth runs long multi-step JS) ─────────
pref("dom.max_script_run_time", 0);

// ── Language — realistic Accept-Language header ───────────────────────────────
// Bare "en-US" with no quality values looks machine-generated to Google.
pref("intl.accept_languages", "en-US, en");
pref("intl.locale.requested", "en-US");

// ── Geolocation — disabled ────────────────────────────────────────────────────
// In a container there is no GPS/WiFi/IP geolocation. Firefox will stall on
// the geolocation probe, then return an error — a signal Google uses.
// Disabling it makes the browser behave like a desktop with location off.
pref("geo.enabled", false);
pref("geo.provider.use_corelocation", false);
pref("geo.provider.use_gpsd", false);
pref("geo.provider.use_geoclue", false);

// ── Cache — keep disk cache on ────────────────────────────────────────────────
// Google checks cache headers on return visits. A browser with no cache on
// every asset load (Google fonts, scripts, icons) looks like a fresh machine.
// Disk cache is on by default — we make it explicit and give it headroom.
pref("browser.cache.disk.enable", true);
pref("browser.cache.disk.capacity", 524288); // 512 MB

// ── Cookies & tracking protection — required for Google sign-in ──────────────
// Firefox ESR 128 default cookieBehavior=5 (Total Cookie Protection) isolates
// cookies per top-level site, breaking Google's cross-domain auth flow.
pref("network.cookie.cookieBehavior", 0);
pref("network.cookie.cookieBehavior.pbmode", 0);
pref("privacy.trackingprotection.enabled", false);
pref("privacy.trackingprotection.socialtracking.enabled", false);
pref("privacy.trackingprotection.cryptomining.enabled", false);
pref("privacy.trackingprotection.fingerprinting.enabled", false);

// ── Fingerprinting — disabled ─────────────────────────────────────────────────
// resistFingerprinting spoofs canvas/WebGL/font APIs, making Firefox look
// like it's hiding something. Google's bot-detection specifically checks for
// spoofed canvas fingerprints. Real software-rendered values are fine.
pref("privacy.resistFingerprinting", false);
pref("privacy.fingerprintingProtection", false);

// ── WebRTC — restrict to VPN/LAN IP only ─────────────────────────────────────
// WebRTC can leak the real container IP even through a proxy, and an obvious
// Docker RFC-1918 address is a datacenter signal. Restrict to default route.
pref("media.peerconnection.ice.default_address_only", true);

// ── Notifications — deny silently ────────────────────────────────────────────
// Gmail requests notification permission. A container can't fulfil it and the
// permission prompt stalls the page. Auto-deny it.
pref("permissions.default.desktop-notification", 2);

// ── Safe browsing — disable background lookups ────────────────────────────────
// Safe browsing sends hashed URLs to Google for phishing checks. In a container
// these lookups can fail/stall and create anomalous network patterns.
pref("browser.safebrowsing.malware.enabled", false);
pref("browser.safebrowsing.phishing.enabled", false);
pref("browser.safebrowsing.downloads.enabled", false);

// ── First-run / session noise ─────────────────────────────────────────────────
pref("browser.shell.checkDefaultBrowser", false);
pref("browser.startup.page", 0);
pref("browser.startup.homepage", "about:blank");
pref("browser.sessionstore.resume_from_crash", false);
pref("browser.aboutwelcome.enabled", false);
pref("startup.homepage_welcome_url", "");
pref("startup.homepage_welcome_url.additional", "");
pref("browser.startup.firstrunSkipsHomepage", true);
pref("datareporting.policy.dataSubmissionPolicyBypassNotification", true);

// ── Downloads ─────────────────────────────────────────────────────────────────
pref("browser.download.dir", "/home/agent/Downloads");
pref("browser.download.folderList", 2);
pref("browser.download.useDownloadDir", true);
pref("browser.download.always_ask_before_handling_new_types", false);

// ── Telemetry / background services ──────────────────────────────────────────
pref("toolkit.telemetry.enabled", false);
pref("toolkit.telemetry.unified", false);
pref("datareporting.healthreport.uploadEnabled", false);
pref("app.normandy.enabled", false);
pref("app.shield.optoutstudies.enabled", false);

// ── Bookmarks toolbar ─────────────────────────────────────────────────────────
pref("browser.toolbars.bookmarks.visibility", "always");
