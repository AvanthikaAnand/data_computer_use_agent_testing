version: "3.9"

services:
  agent:
    build: .
    image: cu-agent:latest
    container_name: cu-agent
    shm_size: "2gb"          # Chrome needs this
    environment:
      - DISPLAY_NUM=1
      - WIDTH=${WIDTH:-1366}
      - HEIGHT=${HEIGHT:-768}
      # Provider selection (override in .env)
      - CU_PROVIDER=${CU_PROVIDER:-bedrock}
      - CU_MODEL=${CU_MODEL:-claude-sonnet-3-7}
      # AWS (for Bedrock)
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      # Direct Anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    ports:
      - "6080:6080"    # noVNC desktop (browser access)
      - "5901:5901"    # Raw VNC (use VNC client for lower latency)
      - "7860:7860"    # Gradio agent UI
    volumes:
      - ./config.yaml:/home/agent/app/config.yaml:ro
      - agent-home:/home/agent
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN       # required for Xvfb
    security_opt:
      - seccomp:unconfined

volumes:
  agent-home:
