services:

  # ── Traefik load balancer ────────────────────────────────────────────────
  # PREREQUISITE (Mac): Docker Desktop → Settings → Advanced →
  #   enable "Allow the default Docker socket to be used"
  traefik:
    image: traefik:v2.11
    container_name: traefik
    user: root                  # needed to read /var/run/docker.sock on Mac
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
    ports:
      - "80:80"       # load-balanced agent API
      - "8081:8080"   # Traefik dashboard → http://localhost:8081
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ── PostgreSQL (LiteLLM spend persistence) ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LiteLLM proxy (cost tracking + model routing) ────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    command: --config /litellm_config.yaml --detailed_debug
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"   # API → http://localhost:4000
                      # Dashboard → http://localhost:4000/ui
    volumes:
      - ./litellm_config.yaml:/litellm_config.yaml:ro
    environment:
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-local}
      - UI_USERNAME=${LITELLM_UI_USERNAME:-admin}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD:-admin}
    restart: unless-stopped

  # ── Agent (scale: docker compose up --scale agent=3) ─────────────────────
  agent:
    build:
      context: .
      platforms:
        - linux/amd64
    image: cu-agent:latest
    platform: linux/amd64
    depends_on:
      litellm:
        condition: service_started
    shm_size: "2gb"
    environment:
      - DISPLAY_NUM=1
      - WIDTH=${WIDTH:-1366}
      - HEIGHT=${HEIGHT:-768}
      - CU_PROVIDER=${CU_PROVIDER:-bedrock}
      - CU_MODEL=${CU_MODEL:-claude-sonnet-3-7}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - LITELLM_API_BASE=http://litellm:4000
      # VPN keepalive — leave blank to disable
      - VPN_KEEPALIVE_URL=${VPN_KEEPALIVE_URL:-}
      - VPN_CHECK_INTERVAL=${VPN_CHECK_INTERVAL:-300}
    ports:
      - "6080:6080"   # noVNC desktop
      - "7860:7860"   # Gradio UI
    volumes:
      - ./config.yaml:/home/agent/app/config.yaml:ro
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.agent-api.rule=PathPrefix(`/`)"
      - "traefik.http.routers.agent-api.entrypoints=web"
      - "traefik.http.services.agent-api.loadbalancer.server.port=8000"
      - "traefik.http.services.agent-api.loadbalancer.sticky.cookie=true"

volumes:
  postgres-data:
