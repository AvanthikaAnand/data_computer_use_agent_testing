# ── Shared agent definition (YAML anchor) ────────────────────────────────────
x-agent: &agent-base
  build:
    context: .
    platforms: [linux/amd64]
  image: cu-agent:latest
  platform: linux/amd64
  depends_on:
    litellm:
      condition: service_started
    postgres:
      condition: service_healthy
  shm_size: "2gb"
  env_file:
    - agent.env          # shared non-secret config
  environment:           # secrets + per-agent overrides go here
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
    - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    - WIDTH=${WIDTH:-1366}
    - HEIGHT=${HEIGHT:-768}
    - VPN_KEEPALIVE_URL=${VPN_KEEPALIVE_URL:-}
    - VPN_CHECK_INTERVAL=${VPN_CHECK_INTERVAL:-300}
  volumes:
    - ./config.yaml:/home/agent/app/config.yaml:ro
  restart: unless-stopped
  cap_add: [SYS_ADMIN]
  security_opt: [seccomp:unconfined]
  labels:
    - "traefik.enable=true"
    - "traefik.http.routers.agent-api.rule=PathPrefix(`/`)"
    - "traefik.http.routers.agent-api.entrypoints=web"
    - "traefik.http.services.agent-api.loadbalancer.server.port=8000"
    - "traefik.http.services.agent-api.loadbalancer.sticky.cookie=true"
    - "traefik.http.services.agent-api.loadbalancer.sticky.cookie.name=cu_agent"

services:

  # ── Traefik load balancer ─────────────────────────────────────────────────
  traefik:
    image: traefik:v2.11
    container_name: traefik
    user: root
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --api.dashboard=true
      - --api.insecure=true
      - --accesslog=true
    ports:
      - "80:80"       # load-balanced API across all 5 agents
      - "8081:8080"   # Traefik dashboard → http://localhost:8081
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

  # ── PostgreSQL (LiteLLM spend persistence) ───────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── LiteLLM proxy ─────────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    command: --config /litellm_config.yaml --detailed_debug
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    volumes:
      - ./litellm_config.yaml:/litellm_config.yaml:ro
    environment:
      - DATABASE_URL=postgresql://litellm:litellm@postgres:5432/litellm
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-local}
      - UI_USERNAME=${LITELLM_UI_USERNAME:-admin}
      - UI_PASSWORD=${LITELLM_UI_PASSWORD:-admin}
    restart: unless-stopped

  # ── Agents (5 minimum, all identical except AGENT_ID + ports) ────────────
  cu-agent-1:
    <<: *agent-base
    container_name: cu-agent-1
    hostname: cu-agent-1
    environment:
      - AGENT_ID=1
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WIDTH=${WIDTH:-1366}
      - HEIGHT=${HEIGHT:-768}
      - VPN_KEEPALIVE_URL=${VPN_KEEPALIVE_URL:-}
      - VPN_CHECK_INTERVAL=${VPN_CHECK_INTERVAL:-300}
    ports:
      - "6081:6080"
      - "7861:7860"

  cu-agent-2:
    <<: *agent-base
    container_name: cu-agent-2
    hostname: cu-agent-2
    environment:
      - AGENT_ID=2
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WIDTH=${WIDTH:-1366}
      - HEIGHT=${HEIGHT:-768}
      - VPN_KEEPALIVE_URL=${VPN_KEEPALIVE_URL:-}
      - VPN_CHECK_INTERVAL=${VPN_CHECK_INTERVAL:-300}
    ports:
      - "6082:6080"
      - "7862:7860"

  cu-agent-3:
    <<: *agent-base
    container_name: cu-agent-3
    hostname: cu-agent-3
    environment:
      - AGENT_ID=3
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WIDTH=${WIDTH:-1366}
      - HEIGHT=${HEIGHT:-768}
      - VPN_KEEPALIVE_URL=${VPN_KEEPALIVE_URL:-}
      - VPN_CHECK_INTERVAL=${VPN_CHECK_INTERVAL:-300}
    ports:
      - "6083:6080"
      - "7863:7860"

  cu-agent-4:
    <<: *agent-base
    container_name: cu-agent-4
    hostname: cu-agent-4
    environment:
      - AGENT_ID=4
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WIDTH=${WIDTH:-1366}
      - HEIGHT=${HEIGHT:-768}
      - VPN_KEEPALIVE_URL=${VPN_KEEPALIVE_URL:-}
      - VPN_CHECK_INTERVAL=${VPN_CHECK_INTERVAL:-300}
    ports:
      - "6084:6080"
      - "7864:7860"

  cu-agent-5:
    <<: *agent-base
    container_name: cu-agent-5
    hostname: cu-agent-5
    environment:
      - AGENT_ID=5
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - WIDTH=${WIDTH:-1366}
      - HEIGHT=${HEIGHT:-768}
      - VPN_KEEPALIVE_URL=${VPN_KEEPALIVE_URL:-}
      - VPN_CHECK_INTERVAL=${VPN_CHECK_INTERVAL:-300}
    ports:
      - "6085:6080"
      - "7865:7860"

  # ── Multi-agent monitoring dashboard ─────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      platforms: [linux/amd64]
    container_name: cu-dashboard
    platform: linux/amd64
    ports:
      - "8503:8503"   # → http://localhost:8503
    environment:
      - AGENT_URLS=http://cu-agent-1:8000,http://cu-agent-2:8000,http://cu-agent-3:8000,http://cu-agent-4:8000,http://cu-agent-5:8000
      - AGENT_HOST=${AGENT_HOST:-localhost}
      - VNC_PORTS=6081,6082,6083,6084,6085
      - UI_PORTS=7861,7862,7863,7864,7865
      - DASHBOARD_PORT=8503
    depends_on:
      - cu-agent-1
    restart: unless-stopped

volumes:
  postgres-data:
